[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuiify"
version = "0.1.0"
description = "Generate Textual forms from typed Python functions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tuiify"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.envs.hatch-test]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest {args}"
